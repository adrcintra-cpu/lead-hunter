# Publica as Edge Functions do Supabase a cada push na main que mexe em supabase/functions.
# Precisa de um único segredo no GitHub: SUPABASE_ACCESS_TOKEN
# (Supabase → Account → Access Tokens; GitHub → Settings → Secrets and variables → Actions).
# Migrations NÃO são aplicadas aqui: banco continua manual (npx supabase db push), com revisão.
name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch: {}

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: duzmucxlwssulbmqduqu
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir o token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Chamadas pelo site, com o login do usuário (JWT verificado).
      - name: ai
        run: supabase functions deploy ai --project-ref "$PROJECT_REF" --use-api
      - name: providers
        run: supabase functions deploy providers --project-ref "$PROJECT_REF" --use-api

      # Chamadas por agendador, serviço ou webhook: cada uma confere o próprio segredo.
      - name: cadence-runner
        run: supabase functions deploy cadence-runner --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: whatsapp-qr-inbound
        run: supabase functions deploy whatsapp-qr-inbound --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: email-webhook
        run: supabase functions deploy email-webhook --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
